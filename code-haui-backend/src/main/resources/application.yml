server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: code-haui-backend

  datasource:
    url: jdbc:mysql://localhost:3306/code_haui_db
    username: root
    password: codehaui
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Tự động nạp 14 bảng & 20 Users, 15 Bài tập, 4 Khóa học khi chạy Backend
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
      encoding: UTF-8

# JWT Security Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours in milliseconds
    refresh-expiration-ms: 604800000 # 7 days

# SpringDoc / Swagger OpenAPI 3 UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true

# CORS Configuration
cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
